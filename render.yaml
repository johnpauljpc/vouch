services:
  - type: web
    plan: free
    name: vouch
    runtime: python
    buildCommand: './build.sh'
    startCommand: >
      python -m gunicorn vouch.asgi:application
      -k uvicorn.workers.UvicornWorker
      --workers 1
      --timeout 120
      --graceful-timeout 30
      --max-requests 300
      --max-requests-jitter 50
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: EMAIL_TIMEOUT
        value: 10
